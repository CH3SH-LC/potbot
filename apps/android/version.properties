# potbot 手机 App —— 版本身份的**单一事实源**（APP-01）
#
# 由 apps/android/app/build.gradle 读取；打包时的 versionCode / versionName 与
# 运行时用于对照的产品版本都来自这里，避免"打包版本"与"产品版本"各写一份、各自漂移。
#
# 规则：
#  - productVersion 必须与仓库根 package.json 的 version 一致（测试会核对，漂移即红）；
#  - versionName   必须与 productVersion 一致（同一个发布只有一个版本号）；
#  - versionCode   由 versionName 按固定方案推导：major*1000000 + minor*1000 + patch
#                  （0.13.0 -> 0*1000000 + 13*1000 + 0 = 13000）；单调递增，供系统判"升级"。
#
# 版本号由总协调在改根版本时同步更新（见 tests/full-app/android/version-identity.test.ts）。

productVersion=0.13.0
versionCode=13000
versionName=0.13.0
